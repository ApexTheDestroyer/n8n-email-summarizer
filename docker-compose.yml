version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: n8n_secure_password_123 # Change this to a secure password
      POSTGRES_DB: n8n_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_user -d n8n_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Database Configuration
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: n8n_user
      DB_POSTGRESDB_PASSWORD: n8n_secure_password_123 # Must match POSTGRES_PASSWORD above

      # Security & File System
      N8N_RESTRICT_FILE_ACCESS_TO: /files/
      N8N_ENCRYPTION_KEY: "change_this_to_a_random_32_char_string" # Protects credentials

      # Execution Pruning (Prevents Disk Bloat)
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168 # Keeps logs for 7 days
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000

      # Timezone
      GENERIC_TIMEZONE: "Asia/Manila" # Change to your preferred timezone
      TZ: "Asia/Manila"
    volumes:
      - n8n_data:/home/node/.n8n
      - C:\n8n:/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  n8n_data:
    external: true
  postgres_data:
